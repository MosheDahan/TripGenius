name: tripspark

services:
  tripspark-db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tripspark_db}
      MYSQL_USER: ${MYSQL_USER:-tripspark_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - tripspark

  tripspark-backend:
    build:
      context: ./Backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: tripspark-db
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-tripspark_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      DB_NAME: ${MYSQL_DATABASE:-tripspark_db}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      AI_MODEL: ${AI_MODEL:-gemini-3.5-flash-lite}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      UPLOADS_DIR: /app/uploads
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      - vacation_uploads:/app/uploads
    depends_on:
      tripspark-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/test-db').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - tripspark

  tripspark-frontend:
    build:
      context: ./Frontend
      args:
        REACT_APP_API_URL: /api
        REACT_APP_DEVELOPER_NAME: ${REACT_APP_DEVELOPER_NAME:-Moshe Dahan}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      tripspark-backend:
        condition: service_healthy
    networks:
      - tripspark

volumes:
  mysql_data:
  vacation_uploads:

networks:
  tripspark:
    driver: bridge
