services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tripgenius_db}
      MYSQL_USER: ${MYSQL_USER:-tripgenius_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - tripgenius

  backend:
    build:
      context: ./Backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-tripgenius_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      DB_NAME: ${MYSQL_DATABASE:-tripgenius_db}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      UPLOADS_DIR: /app/uploads
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      - vacation_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/test-db').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - tripgenius

  frontend:
    build:
      context: ./Frontend
      args:
        REACT_APP_API_URL: /api
        REACT_APP_DEVELOPER_NAME: ${REACT_APP_DEVELOPER_NAME:-Moshe Dahan}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - tripgenius

volumes:
  mysql_data:
  vacation_uploads:

networks:
  tripgenius:
    driver: bridge
